# AegisVault CI/CD Automated Workflow
name: AegisVault CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Install Dependencies
        run: pip install -r requirements.txt

      - name: 4. Run Automated Security & Timer Unit Tests (Pytest)
        run: python -m pytest -v

      - name: 5. Build Docker Image
        run: docker build -t aegis-vault:latest .

      - name: 6. Boot Container & Verify Live Health
        run: |
          docker run -d --name test_vault -p 8000:8000 aegis-vault:latest
          sleep 3
          curl -f http://localhost:8000/
          docker stop test_vault
