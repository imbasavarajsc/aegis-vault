services:
  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    ports:
      - "6379:6379"
    restart: always

  web:
    build: .
    container_name: aegis_web_api
    ports:
      - "8080:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: always

  worker:
    build: .
    container_name: aegis_watchdog_worker
    command: python app/worker.py
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: always